<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Tumor Prediction</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap");

    /* Body Styling */
    body {
      font-family: "Cal Sans", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      transition: background 0.5s ease;
    }

    /* Main Heading */
    h1 {
      color: #0f3057;
      font-size: 3rem;
      margin-bottom: 25px;
      text-shadow: 2px 2px #b3e5fc;
      animation: slideDown 1s ease;
    }

    @keyframes slideDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Form Container */
    form {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }

    form:hover {
      transform: scale(1.02);
    }

    /* File Input */
    input[type="file"] {
      margin: 20px 0;
      padding: 12px;
      font-size: 1rem;
      border-radius: 10px;
      border: 2px solid #0f3057;
      background-color: #f9f9f9;
      cursor: pointer;
      transition: border-color 0.3s ease, background-color 0.3s ease;
    }

    input[type="file"]:hover {
      border-color: #2fa793;
      background-color: #e0f7fa;
    }

    /* Button Styling */
    button {
      padding: 12px 25px;
      font-size: 1.1rem;
      border: none;
      background: linear-gradient(90deg, #2fa793, #45a049);
      color: white;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
    }

    button:hover {
      background: linear-gradient(90deg, #45a049, #2fa793);
      transform: translateY(-3px);
      box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
    }

    /* Uploaded Image */
    img {
      max-width: 300px;
      max-height: 300px;
      margin-top: 20px;
      border-radius: 15px;
      border: 4px solid #2fa793;
      box-shadow: 0px 10px 20px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    /* Prediction Text */
    h2 {
      color: #0f3057;
      font-size: 1.7rem;
      margin-top: 20px;
      text-shadow: 1px 1px #b3e5fc;
    }
  </style>
</head>
<body>
  <h1>Brain Tumor Prediction</h1>
  <form method="POST" enctype="multipart/form-data">
    <input type="file" name="file" required />
    <button type="submit">Upload and Predict</button>
  </form>

  {% if prediction %}
    <h2>Prediction: {{ prediction }}</h2>
    <img src="{{ image_path }}" alt="Uploaded Image" />
  {% endif %}
</body>
</html>
